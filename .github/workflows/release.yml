name: Release Windows app

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Read version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          "value=$version" >> $env:GITHUB_OUTPUT

      - name: Publish application
        run: >-
          dotnet publish AvaloniaFunctionKeyTemplate.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:Version=${{ steps.version.outputs.value }}
          -o publish

      - name: Install Velopack CLI
        run: dotnet tool install --global vpk --version 1.2.0

      - name: Download previous release
        continue-on-error: true
        run: >-
          vpk download github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel win
          --outputDir Releases

      - name: Build installer and update packages
        run: >-
          vpk pack
          --packId AvaloniaFunctionKeyTemplate
          --packVersion ${{ steps.version.outputs.value }}
          --packDir publish
          --mainExe AvaloniaFunctionKeyTemplate.exe
          --packTitle AvaloniaFunctionKeyTemplate
          --packAuthors jun-na
          --channel win
          --runtime win-x64
          --outputDir Releases

      - name: Publish GitHub Release
        run: >-
          vpk upload github
          --repoUrl https://github.com/${{ github.repository }}
          --token ${{ secrets.GITHUB_TOKEN }}
          --channel win
          --outputDir Releases
          --publish
          --releaseName "AvaloniaFunctionKeyTemplate ${{ steps.version.outputs.value }}"
          --tag ${{ github.ref_name }}
          --targetCommitish ${{ github.sha }}
